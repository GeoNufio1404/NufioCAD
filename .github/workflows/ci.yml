name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:

jobs:
  linux:
    name: Linux (Ubuntu, paquetes del sistema)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libocct-foundation-dev libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev libocct-visualization-dev \
            libocct-data-exchange-dev libocct-ocaf-dev libocct-draw-dev \
            occt-misc libtbb-dev \
            qt6-base-dev libqt6svg6-dev libgl-dev libglu1-mesa-dev \
            libsqlite3-dev nlohmann-json3-dev libeigen3-dev catch2

      - name: Configurar
        run: cmake --preset linux-release

      - name: Compilar
        run: cmake --build --preset linux-release

      - name: Pruebas del núcleo
        run: ctest --preset linux-release

      - name: Autoprueba de la app
        run: ./build/linux-release/src/app/NufioCAD --self-check

      # Prueba de interfaz con la ventana real sobre una pantalla virtual (Xvfb) y OpenGL por software (Mesa):
      # abre cada herramienta, dibuja, comprueba píxeles (guía naranja, vista previa, temas) y que ninguna parada
      # de la interfaz pase del umbral. Las capturas de los dos temas se suben para mirarlas a ojo.
      # Bloquea el CI desde el 17 nov. 2026 (la primera ejecución dio 44 pasos, 0 fallidos, parada máx. 278 ms).
      # Si falla por una parada lenta del runner y no por el código, subir --umbral-ms. Ver docs/hoja-de-ruta.md (Fase 14, P3).
      - name: Instalar pantalla virtual
        run: sudo apt-get install -y xvfb libgl1-mesa-dri libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 fonts-dejavu-core

      - name: Prueba de interfaz (Xvfb)
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.5"
          MESA_GLSL_VERSION_OVERRIDE: "450"
        run: |
          mkdir -p capturas
          xvfb-run -a -s "-screen 0 1600x900x24" ./build/linux-release/src/app/NufioCAD --prueba-interfaz --informe capturas/informe.txt --umbral-ms 1000
          xvfb-run -a -s "-screen 0 1600x900x24" ./build/linux-release/src/app/NufioCAD --captura-temas capturas

      - name: Subir informe y capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-de-interfaz-linux
          path: capturas
          if-no-files-found: ignore

  windows:
    name: Windows (MSVC + vcpkg)
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true

      # Clon propio de vcpkg (completo, no superficial): la baseline fijada en
      # vcpkg.json debe existir en su historial, y el vcpkg preinstalado del
      # runner puede ser más viejo que esa baseline.
      - name: Preparar vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:GITHUB_WORKSPACE\vcpkg"
          & "$env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      - name: Variables de entorno
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" >> $env:GITHUB_ENV
          "QT_ROOT=$env:QT_ROOT_DIR" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      # La caché se restaura aquí y se guarda justo después de configurar
      # (cuando vcpkg ya compiló OCCT), aunque fallen los pasos siguientes.
      # Cada ejecución guarda la caché con una clave nueva (el número de
      # ejecución) y restaura la más reciente: si vcpkg tuvo que recompilar
      # algo (por ejemplo, porque cambió el compilador del runner), lo nuevo
      # se guarda. Con una clave fija, una restauración exacta impediría
      # guardar y se recompilaría OCCT (≈2 h) en cada ejecución.
      - name: Restaurar caché de vcpkg (OCCT tarda en compilar la primera vez)
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}-
            vcpkg-${{ runner.os }}-

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configurar
        run: cmake --preset windows-release

      - name: Guardar caché de vcpkg
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Compilar
        run: cmake --build --preset windows-release

      - name: Pruebas del núcleo
        run: ctest --preset windows-release

      - name: Autoprueba de la app
        shell: pwsh
        run: |
          $env:PATH = "$env:QT_ROOT\bin;$env:PATH"
          & .\build\windows-release\src\app\NufioCAD.exe --self-check | Out-Host
          if ($LASTEXITCODE -ne 0) { exit 1 }
